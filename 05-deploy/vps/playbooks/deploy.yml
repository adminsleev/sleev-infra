---
# 05-deploy/vps/playbooks/deploy.yml
# Usage (via Justfile):
#   just deploy 05-deploy/vps dev ghcr.io/sleev/sleev-website-app
#   just deploy 05-deploy/vps prod ghcr.io/sleev/sleev-website-app prod-abc1234
#
# Required extra-vars: env, image_tag, ghcr_image
# Infra secrets: 90-secrets/enc.server.yaml (ghcr_read_token)
# App secrets: passed as --extra-vars from Justfile or GitHub Actions
#              (decrypted from sleev-website-app/secrets/enc.app.{{ env }}.yaml)

- name: "Deploy sleev app — {{ env | default('') | upper }}"
  hosts: all
  remote_user: deploy
  become: false
  gather_facts: false
  vars:
    ansible_ssh_private_key_file: "~/.ssh/sleev_github_to_vps_deploy"

  pre_tasks:
    - name: Validate required extra-vars are present
      ansible.builtin.assert:
        that:
          - env is defined and env in ['dev', 'prod']
          - image_tag is defined and image_tag | length > 0
        fail_msg: >-
          Both `env` (dev|prod) and `image_tag` must be supplied as --extra-vars.
          Example: ansible-playbook deploy.yml -e env=prod -e image_tag=prod-abc1234

    - name: Load server-wide SOPS secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../../90-secrets/enc.server.yaml"
        expressions: evaluate-on-load
      delegate_to: localhost
      run_once: true
      no_log: true

  roles:
    - role: app
      vars:
        app_dir: "/opt/app/{{ env }}"
        app_port: "{{ '3000' if env == 'prod' else '3001' }}"
        run_migrations: true
        # enc.server.yaml provides: ghcr_read_token
        # App vars (database_url, email_*, ga_id, etc.) arrive as --extra-vars
        # from sleev-website-app/secrets/enc.app.{{ env }}.yaml
