[defaults]
roles_path            = 00-environment/vps/roles:05-deploy/vps/roles
# Disabled: VPS is only reachable via Tailscale (no public IP exposure); key
# pinning would break on every Tailscale re-auth. Re-enable if using a fixed IP.
host_key_checking     = False
stdout_callback       = ansible.builtin.default
retry_files_enabled   = False
interpreter_python    = auto_silent
collections_path      = ~/.ansible/collections
gathering             = smart
fact_caching          = jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout  = 3600

[callback_default]
result_format         = yaml

[ssh_connection]
ssh_args    = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
pipelining  = True
