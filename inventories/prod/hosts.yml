---
# Dev and prod are co-located on the same VPS. If this changes, update ansible_host here.
# ansible_user/key below are for provision (00-environment/vps) playbooks running as root.
# Deploy/maintenance playbooks override remote_user to 'deploy' and key to ~/.ssh/sleev_github_to_vps_deploy.
all:
  hosts:
    vps:
      ansible_host: sleev-vps
      ansible_user: root
      ansible_ssh_private_key_file: "~/.ssh/id_ed25519_hostinger_vpsleev_vps-access"
