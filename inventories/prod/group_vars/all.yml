---
# Dev cluster listens on all interfaces; pg_hba.conf restricts to Tailscale subnet only.
# Prod cluster stays localhost-only (default in postgresql role).
pg_dev_listen_addresses: "*"

env: prod
ghcr_owner: sleev
app_port: 3000
pg_port: 5432
pg_db: app_prod
pg_user: app_prod
domain: sleev.org
app_dir: /opt/app/prod
backup_dir: /opt/backups/prod
backup_retention_days: 7

# Public key for the deploy OS user (GitHub Actions SSH key).
# Dev and prod share the same deploy keypair since they live on the same VPS.
deploy_ssh_public_key: "ssh-ed25519 AAAA... github-actions-sleev-deploy"
