---
# One-time playbook. Connects via public SSH as root.
# Installs Tailscale, creates deploy user, locks down SSH to Tailscale subnet.
# After this runs, port 22 is closed to the public internet.
- name: Bootstrap VPS — install Tailscale and harden SSH
  hosts: all
  become: true
  roles:
    - tailscale
    - common
