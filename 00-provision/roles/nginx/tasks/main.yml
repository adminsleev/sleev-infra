---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy prod vhost config
  ansible.builtin.template:
    src: prod.conf.j2
    dest: /etc/nginx/sites-available/prod.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable prod vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/prod.conf
    dest: /etc/nginx/sites-enabled/prod.conf
    state: link
  notify: Reload nginx

- name: Deploy dev vhost config
  ansible.builtin.template:
    src: dev.conf.j2
    dest: /etc/nginx/sites-available/dev.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable dev vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/dev.conf
    dest: /etc/nginx/sites-enabled/dev.conf
    state: link
  notify: Reload nginx

- name: Create .htpasswd file for dev basic auth
  community.general.htpasswd:
    path: /etc/nginx/.htpasswd-dev
    name: "{{ dev_htpasswd_user }}"
    password: "{{ dev_htpasswd_pass }}"
    owner: root
    group: www-data
    mode: "0640"
  no_log: true

- name: Test Nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Install Certbot and Nginx plugin
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Check if SAN certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ nginx_prod_primary_domain }}/fullchain.pem"
  register: nginx_cert_stat

- name: Obtain SAN SSL certificate
  ansible.builtin.command: >
    certbot --nginx
    -d {{ nginx_prod_primary_domain }}
    -d {{ nginx_prod_alt_domain }}
    -d {{ nginx_dev_domain }}
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
  when: not nginx_cert_stat.stat.exists
  changed_when: not nginx_cert_stat.stat.exists
  notify: Reload nginx

- name: Verify certbot renewal timer is active
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started
