---
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - ufw
      - fail2ban
      - htop
      - unzip
      - apache2-utils
      - python3-passlib
    state: present

- name: Install rclone
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://rclone.org/install.sh | bash
    executable: /bin/bash
    creates: /usr/bin/rclone

- name: Create rclone config directory
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write rclone R2 config
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Stop Coolify service if present
  ansible.builtin.systemd:
    name: coolify
    state: stopped
    enabled: false
  failed_when: false

- name: Remove Coolify nginx config
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/coolify.conf
    state: absent
  failed_when: false

- name: Create deploy OS user
  ansible.builtin.user:
    name: deploy
    shell: /bin/bash
    create_home: true
    home: /home/deploy
    password: "!"
    state: present

- name: Create deploy .ssh directory
  ansible.builtin.file:
    path: /home/deploy/.ssh
    state: directory
    owner: deploy
    group: deploy
    mode: "0700"

- name: Set authorized key for deploy user
  ansible.posix.authorized_key:
    user: deploy
    key: "{{ deploy_ssh_public_key }}"
    state: present

- name: Create app and backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"
  loop:
    - /opt/app
    - /opt/app/dev
    - /opt/app/prod
    - /opt/backups
    - /opt/backups/dev
    - /opt/backups/dev/db
    - /opt/backups/prod
    - /opt/backups/prod/db

- name: Disable password authentication in sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
  notify: Restart sshd

- name: Configure fail2ban SSH jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.conf
    content: |
      [sshd]
      enabled  = true
      port     = ssh
      filter   = sshd
      logpath  = /var/log/auth.log
      maxretry = 5
      bantime  = 3600
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Set UFW default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set UFW default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow HTTP (public)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS (public)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow SSH from Tailscale subnet only
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ common_tailscale_cidr }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
