---
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - ufw
      - fail2ban
      - htop
      - unzip
      - apache2-utils
      - python3-passlib
    state: present

- name: Install rclone
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://rclone.org/install.sh | bash
    executable: /bin/bash
    creates: /usr/bin/rclone

- name: Create rclone config directory
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write rclone R2 config
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Partial Coolify cleanup — stops the service and removes its nginx config only.
# Docker containers, volumes, and /data/coolify are left in place.
- name: Stop Coolify service if present
  ansible.builtin.systemd:
    name: coolify
    state: stopped
    enabled: false
  failed_when: false

- name: Remove Coolify nginx config
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/coolify.conf
    state: absent
  failed_when: false

- name: Create deploy OS user
  ansible.builtin.user:
    name: "{{ common_deploy_user }}"
    shell: /bin/bash
    create_home: true
    home: "{{ common_deploy_home }}"
    password: "!"
    state: present

- name: Create deploy .ssh directory
  ansible.builtin.file:
    path: "{{ common_deploy_home }}/.ssh"
    state: directory
    owner: "{{ common_deploy_user }}"
    group: "{{ common_deploy_user }}"
    mode: "0700"

- name: Set authorized key for deploy user
  ansible.posix.authorized_key:
    user: "{{ common_deploy_user }}"
    key: "{{ deploy_ssh_public_key }}"
    state: present

- name: Create app and backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ common_deploy_user }}"
    group: "{{ common_deploy_user }}"
    mode: "0755"
  loop:
    - "{{ common_app_base_dir }}"
    - "{{ common_app_base_dir }}/dev"
    - "{{ common_app_base_dir }}/prod"
    - "{{ common_backup_base_dir }}"
    - "{{ common_backup_base_dir }}/dev"
    - "{{ common_backup_base_dir }}/dev/db"
    - "{{ common_backup_base_dir }}/prod"
    - "{{ common_backup_base_dir }}/prod/db"

- name: Disable password authentication in sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
  notify: Restart sshd

- name: Configure fail2ban SSH jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.conf
    content: |
      [sshd]
      enabled  = true
      port     = ssh
      filter   = sshd
      logpath  = /var/log/auth.log
      maxretry = 5
      bantime  = 3600
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Set UFW default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set UFW default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow HTTP (public)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS (public)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow SSH from Tailscale subnet only
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ common_tailscale_cidr }}"

# IMPORTANT: Tailscale must be running and have an IP in 100.64.0.0/10 before this task
# runs, otherwise the SSH rule below won't match the current connection and the session
# will be locked out. The bootstrap playbook runs the tailscale role before this role.
- name: Enable UFW
  community.general.ufw:
    state: enabled
